      border-radius: 14px;
      cursor: pointer;
      opacity: 0.55;
      transition: all 0.2s;

    .lang-btn.active {
      opacity: 1;
      background: rgba(56, 189, 248, 0.25);

    function getSelectedLanguage() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlLang = urlParams.get('lang');
      if (urlLang && PRIVACY_TEXTS[urlLang.toLowerCase()]) {
        return urlLang.toLowerCase();
      }
      try {
        const stored = localStorage.getItem('fuelpilot_lang');
        if (stored && PRIVACY_TEXTS[stored.toLowerCase()]) {
          return stored.toLowerCase();
        }
      } catch (e) {}
      const navLang = (navigator.language || 'fr').slice(0, 2).toLowerCase();
      return PRIVACY_TEXTS[navLang] ? navLang : 'fr';
    }

    function applyLanguage(lang) {
      const data = PRIVACY_TEXTS[lang] || PRIVACY_TEXTS.fr;
      document.documentElement.lang = lang;
      document.getElementById('doc-title').textContent = data.docTitle;
      document.getElementById('title-main').innerHTML = data.headerTitle;
      document.getElementById('badge-date').textContent = data.badgeDate;
      document.getElementById('content-body').innerHTML = data.html;
      const backBtn = document.getElementById('btn-back-app');
      backBtn.textContent = data.backBtn;
      backBtn.href = `index.html?lang=${lang}&_v=${Date.now()}`;

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });

      try {
        localStorage.setItem('fuelpilot_lang', lang);
      } catch (e) {}
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const lang = btn.dataset.lang;
        applyLanguage(lang);
      });
    });

    applyLanguage(getSelectedLanguage());
  </script>
